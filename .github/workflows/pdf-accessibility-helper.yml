name: Build PDF Accessibility Helper

on:
  push:
    branches:
      - build/pdf-accessibility-helper-v0.2
    paths:
      - "pah-build2/**"
      - ".github/workflows/pdf-accessibility-helper.yml"
  workflow_dispatch:

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: powershell
        run: |
          $parts = 0..4 | ForEach-Object { "pah-build2/src_{0:D2}.b64" -f $_ }
          foreach ($part in $parts) {
            if (-not (Test-Path $part)) { throw "Missing source chunk: $part" }
          }
          $b64 = ($parts | ForEach-Object { Get-Content $_ -Raw }) -join ""
          [IO.File]::WriteAllBytes("pdf-accessibility-helper-v0.2.0-source.zip", [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash "pdf-accessibility-helper-v0.2.0-source.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "e53f89f52cc32a744f69770f9e99683304c8648ac2e0f2d7fd706b155f8df060") {
            throw "Source archive hash mismatch: $hash"
          }
          New-Item -ItemType Directory -Force -Path work | Out-Null
          Expand-Archive "pdf-accessibility-helper-v0.2.0-source.zip" -DestinationPath work -Force

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Windows runtime prerequisites
        shell: powershell
        run: |
          choco install tesseract -y --no-progress
          choco install temurin21jre -y --no-progress
          $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("PATH", "User")
          tesseract --version
          java -version

      - name: Run tests and build portable Windows app
        shell: powershell
        working-directory: work/pdf-accessibility-helper
        run: |
          .\scripts\build_windows.ps1

      - name: Package Windows portable build
        shell: powershell
        working-directory: work/pdf-accessibility-helper
        run: |
          Compress-Archive -Path .\dist\PDFAccessibilityHelper\* -DestinationPath .\dist\PDFAccessibilityHelper-Windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PDFAccessibilityHelper-Windows-x64
          path: work/pdf-accessibility-helper/dist/PDFAccessibilityHelper-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PDFAccessibilityHelper-test-corpus-results
          path: |
            work/pdf-accessibility-helper/test-corpus
            work/pdf-accessibility-helper/dist/PDFAccessibilityHelper/build-diagnostics.json
          if-no-files-found: warn
          retention-days: 30
