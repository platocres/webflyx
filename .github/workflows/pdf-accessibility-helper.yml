name: Build PDF Accessibility Helper portable Windows app

on:
  push:
    branches:
      - build/pdf-accessibility-helper-v0.2
    paths:
      - "pah-build2/**"
      - ".github/workflows/pdf-accessibility-helper.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact source archive
        shell: powershell
        run: |
          $chunks = Get-ChildItem .\pah-build2\src_*.b64 | Sort-Object Name
          if ($chunks.Count -ne 5) { throw "Expected 5 source chunks, found $($chunks.Count)." }
          $b64 = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes(".\pdf-accessibility-helper-source.zip", [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash .\pdf-accessibility-helper-source.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "e53f89f52cc32a744f69770f9e99683304c8648ac2e0f2d7fd706b155f8df060"
          if ($actual -ne $expected) { throw "Source archive SHA256 mismatch: $actual" }
          Expand-Archive .\pdf-accessibility-helper-source.zip -DestinationPath . -Force

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install external build dependencies
        shell: powershell
        run: |
          choco install tesseract -y --no-progress
          choco install temurin21jre -y --no-progress
          $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("PATH", "User")
          tesseract --version
          java -version

      - name: Build portable app and run adversarial corpus
        shell: powershell
        run: |
          Set-Location .\pdf-accessibility-helper
          .\scripts\build_windows.ps1

      - name: Create portable release zip
        shell: powershell
        run: |
          Set-Location .\pdf-accessibility-helper
          Compress-Archive -Path .\dist\PDFAccessibilityHelper\* -DestinationPath .\dist\PDFAccessibilityHelper-Windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PDFAccessibilityHelper-Windows-x64
          path: pdf-accessibility-helper/dist/PDFAccessibilityHelper-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
