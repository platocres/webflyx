name: Build PDF Accessibility Helper v0.3.5

on:
  push:
    branches:
      - build/pdf-accessibility-helper-v0.3.5
  workflow_dispatch:

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct v0.3.5 source archive
        shell: pwsh
        run: |
          $parts = Get-ChildItem pah-src\v035_*.b64 | Sort-Object Name
          if ($parts.Count -ne 8) {
            throw "Expected 8 source chunks, found $($parts.Count)."
          }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ""
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes("$PWD\pdf-helper-source.zip", $bytes)
          Expand-Archive "$PWD\pdf-helper-source.zip" -DestinationPath "$PWD\source" -Force
          if (-not (Test-Path "$PWD\source\pdf-accessibility-helper\pyproject.toml")) {
            throw "Source archive did not reconstruct correctly."
          }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Tesseract
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $tess = Get-Command tesseract.exe -ErrorAction SilentlyContinue
          if (-not $tess) {
            $candidate = "C:\Program Files\Tesseract-OCR\tesseract.exe"
            if (-not (Test-Path $candidate)) { throw "Tesseract installation failed." }
            "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Run source tests
        shell: pwsh
        working-directory: source/pdf-accessibility-helper
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m compileall -q src launcher.py
          python -m pytest -q

      - name: Build and verify Windows portable application
        shell: pwsh
        working-directory: source/pdf-accessibility-helper
        run: |
          .\scripts\build_windows.ps1 -OutputRoot dist
          $exe = ".\dist\PDFAccessibilityHelper\PDFAccessibilityHelper.exe"
          if (-not (Test-Path $exe)) {
            throw "Portable executable was not produced."
          }

      - name: Package portable ZIP
        shell: pwsh
        working-directory: source/pdf-accessibility-helper
        run: |
          $zip = ".\PDF-Accessibility-Helper-v0.3.5-Windows-Portable.zip"
          Compress-Archive -Path ".\dist\PDFAccessibilityHelper\*" -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw "Portable ZIP was not created." }
          Get-FileHash $zip -Algorithm SHA256

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Accessibility-Helper-v0.3.5-Windows-Portable
          path: source/pdf-accessibility-helper/PDF-Accessibility-Helper-v0.3.5-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 7

# Source chunks complete; build trigger.
