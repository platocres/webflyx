name: Build PDF Accessibility Helper v0.4.2

on:
  push:
    branches:
      - build/pdf-accessibility-helper-v0.4.0
  workflow_dispatch:

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "pah-v040\v040_*.b64" | Sort-Object Name
          if ($parts.Count -ne 10) { throw "Expected 10 source chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ""
          [IO.File]::WriteAllBytes("source.zip", [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash "source.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "9d5af5319f95e191ca93741c0aedea0539d5c1f5c8cfa6d8fa169661e04e6c92") {
            throw "Source archive hash mismatch: $hash"
          }
          Expand-Archive "source.zip" -DestinationPath "work" -Force
          if (-not (Test-Path "work\pah040\scripts\build_windows.ps1")) {
            throw "Source archive did not unpack as expected."
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install Windows runtime dependencies
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          choco install temurin21jre --yes --no-progress
          $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("PATH", "User")
          tesseract --version
          java -version
          go version

      - name: Patch v0.4.2 fixes into source
        shell: pwsh
        working-directory: work/pah040
        run: |
          $installerPath = ".\scripts\install_verapdf.ps1"
          $installerScript = Get-Content $installerPath -Raw
          $installerScript = $installerScript.Replace(
            'Invoke-WebRequest -Uri "https://downloads.verapdf.org/rel/verapdf-installer.zip" -OutFile $zip',
            'curl.exe -L --fail --silent --show-error "https://downloads.verapdf.org/rel/verapdf-installer.zip" -o $zip; if ($LASTEXITCODE -ne 0) { throw "veraPDF download failed with exit code $LASTEXITCODE" }'
          )
          Set-Content $installerPath -Value $installerScript -Encoding UTF8

          $launcherPath = ".\launcher.py"
          $launcher = Get-Content $launcherPath -Raw
          if ($launcher -notmatch '(?m)^import asyncio$') {
            $launcher = $launcher.Replace("import argparse", "import argparse" + [Environment]::NewLine + "import asyncio")
          }
          Set-Content $launcherPath -Value $launcher -Encoding UTF8

          $runtimePath = ".\src\pdf_accessibility_helper\runtime.py"
          $runtimeText = Get-Content $runtimePath -Raw
          $oldStart = '        def hidden_popen(*args, **kwargs):  # type: ignore[no-untyped-def]'
          $oldEnd = '        subprocess.Popen = hidden_popen  # type: ignore[assignment]'
          $startIndex = $runtimeText.IndexOf($oldStart)
          $endIndex = $runtimeText.IndexOf($oldEnd)
          if ($startIndex -lt 0 -or $endIndex -lt 0) { throw "Could not locate hidden_popen patch block." }
          $endIndex += $oldEnd.Length
          $newBlock = @'
        class HiddenPopen(_ORIGINAL_POPEN):
            """Popen-compatible subclass that hides Windows helper consoles."""

            def __init__(self, *args, **kwargs):  # type: ignore[no-untyped-def]
                if _CHILD_LAUNCH_BLOCKED.is_set():
                    raise ChildLaunchBlocked("Processing was stopped; helper process launch was blocked.")

                creationflags = int(kwargs.get("creationflags", 0) or 0)
                creationflags &= ~int(getattr(subprocess, "CREATE_NEW_CONSOLE", 0) or 0)
                creationflags |= int(getattr(subprocess, "CREATE_NO_WINDOW", 0) or 0)
                kwargs["creationflags"] = creationflags

                startupinfo = kwargs.get("startupinfo")
                if startupinfo is None:
                    startupinfo = subprocess.STARTUPINFO()
                else:
                    try:
                        startupinfo = copy.copy(startupinfo)
                    except Exception:
                        pass
                startupinfo.dwFlags |= subprocess.STARTF_USESHOWWINDOW
                startupinfo.wShowWindow = getattr(subprocess, "SW_HIDE", 0)
                kwargs["startupinfo"] = startupinfo

                if kwargs.get("stdin") is None:
                    kwargs["stdin"] = subprocess.DEVNULL

                super().__init__(*args, **kwargs)
                _register_child(self)

        subprocess.Popen = HiddenPopen  # type: ignore[assignment]
'@
          $runtimeText = $runtimeText.Substring(0, $startIndex) + $newBlock + $runtimeText.Substring($endIndex)
          Set-Content $runtimePath -Value $runtimeText -Encoding UTF8

          $pipelinePath = ".\src\pdf_accessibility_helper\pipeline.py"
          $pipelineText = Get-Content $pipelinePath -Raw
          $markNeedle = @'
        if not root.get("/Lang", None):
            root["/Lang"] = pikepdf.String("en-US")

        viewer = root.get("/ViewerPreferences", None)
'@
          $markReplacement = @'
        if not root.get("/Lang", None):
            root["/Lang"] = pikepdf.String("en-US")

        mark_info = root.get("/MarkInfo", None)
        if mark_info is None:
            mark_info = pikepdf.Dictionary()
            root["/MarkInfo"] = mark_info
        mark_info["/Marked"] = True

        viewer = root.get("/ViewerPreferences", None)
'@
          if (-not $pipelineText.Contains($markNeedle)) { throw "Could not locate metadata insertion point." }
          $pipelineText = $pipelineText.Replace($markNeedle, $markReplacement)
          if ($pipelineText -notmatch 'from \. import __version__') {
            $pipelineText = $pipelineText.Replace(
              'from .models import BatchResult, FileResult',
              'from .models import BatchResult, FileResult' + [Environment]::NewLine + 'from . import __version__'
            )
          }
          $pipelineText = $pipelineText.Replace(
            '        except importlib.metadata.PackageNotFoundError:' + [Environment]::NewLine + '            versions[label] = "unknown"',
            '        except importlib.metadata.PackageNotFoundError:' + [Environment]::NewLine + '            versions[label] = __version__ if label == "PDF Accessibility Helper" else "unknown"'
          )
          $pipelineText = $pipelineText.Replace('v0.4 uses an adaptive workflow:', 'v0.4.2 uses an adaptive workflow:')
          Set-Content $pipelinePath -Value $pipelineText -Encoding UTF8

          $frontPath = ".\windows_frontend\main.go"
          $front = Get-Content $frontPath -Raw
          $oldDecl = @'
	procSHBrowseForFolderW   = shell32.NewProc("SHBrowseForFolderW")
	procSHGetPathFromIDListW = shell32.NewProc("SHGetPathFromIDListW")
'@
          $newDecl = @'
	procSHBrowseForFolderW   = shell32.NewProc("SHBrowseForFolderW")
	procSHGetPathFromIDListW = shell32.NewProc("SHGetPathFromIDListW")
	procShellExecuteW         = shell32.NewProc("ShellExecuteW")
'@
          if (-not $front.Contains($oldDecl)) { throw "Could not locate shell32 declarations." }
          $front = $front.Replace($oldDecl, $newDecl)

          $oldOpen = @'
func openPath(path string) {
	if path == "" {
		return
	}
	syscall.StartProcess("C:\Windows\explorer.exe", []string{"explorer.exe", path}, &syscall.ProcAttr{Files: []uintptr{0, 1, 2}})
}
'@
          $newOpen = @'
func openPath(owner syscall.Handle, path string) error {
	path = strings.TrimSpace(path)
	if path == "" {
		return fmt.Errorf("no path was provided")
	}
	if _, err := os.Stat(path); err != nil {
		return fmt.Errorf("the path does not exist: %s", path)
	}

	result, _, callErr := procShellExecuteW.Call(
		uintptr(owner),
		uintptr(unsafe.Pointer(utf16("open"))),
		uintptr(unsafe.Pointer(utf16(path))),
		0,
		0,
		SW_SHOW,
	)
	if result <= 32 {
		if callErr != nil && callErr != syscall.Errno(0) {
			return fmt.Errorf("Windows could not open %s: %v", path, callErr)
		}
		return fmt.Errorf("Windows could not open %s (ShellExecute code %d)", path, result)
	}
	return nil
}
'@
          if (-not $front.Contains($oldOpen)) { throw "Could not locate old openPath implementation." }
          $front = $front.Replace($oldOpen, $newOpen)

          $oldHandlers = @'
		case ID_OPEN:
			state.mu.Lock()
			p := state.outputDir
			state.mu.Unlock()
			openPath(p)
		case ID_REPORT:
			state.mu.Lock()
			p := filepath.Join(state.outputDir, "_accessibility_reports", "Accessibility_Remediation_Summary.html")
			state.mu.Unlock()
			openPath(p)
'@
          $newHandlers = @'
		case ID_OPEN:
			state.mu.Lock()
			p := state.outputDir
			state.mu.Unlock()
			if err := openPath(hwnd, p); err != nil {
				messageBox(hwnd, "Open output folder", err.Error(), MB_OK|MB_ICONERROR)
			}
		case ID_REPORT:
			state.mu.Lock()
			p := filepath.Join(state.outputDir, "_accessibility_reports", "Accessibility_Remediation_Summary.html")
			state.mu.Unlock()
			if err := openPath(hwnd, p); err != nil {
				messageBox(hwnd, "View report", err.Error(), MB_OK|MB_ICONERROR)
			}
'@
          if (-not $front.Contains($oldHandlers)) { throw "Could not locate output/report button handlers." }
          $front = $front.Replace($oldHandlers, $newHandlers)
          Set-Content $frontPath -Value $front -Encoding UTF8

          $initPath = ".\src\pdf_accessibility_helper\__init__.py"
          (Get-Content $initPath -Raw).Replace("0.4.0", "0.4.2") | Set-Content $initPath -Encoding UTF8
          (Get-Content ".\pyproject.toml" -Raw).Replace("0.4.0", "0.4.2") | Set-Content ".\pyproject.toml" -Encoding UTF8
          $buildVersionPath = ".\scripts\build_windows.ps1"
          (Get-Content $buildVersionPath -Raw).Replace("0.4.0 - adaptive performance build", "0.4.2 - adaptive performance build") | Set-Content $buildVersionPath -Encoding UTF8

          $buildPath = ".\scripts\build_windows.ps1"
          $lines = Get-Content $buildPath
          $patched = foreach ($line in $lines) {
            $t = $line.Trim()
            if ($t -eq '& $engine --diagnostics $diag') {
              '$p = Start-Process -FilePath $engine -ArgumentList @("--diagnostics", $diag) -Wait -PassThru'
              continue
            }
            if ($t -eq 'if ($LASTEXITCODE -ne 0) { throw "Frozen-app diagnostics failed with exit code $LASTEXITCODE" }') {
              'if ($p.ExitCode -ne 0) { throw "Frozen-app diagnostics failed with exit code $($p.ExitCode)" }'
              continue
            }
            if ($t -eq '& $engine --runtime-self-test $runtimeSelfTest') {
              '$p = Start-Process -FilePath $engine -ArgumentList @("--runtime-self-test", $runtimeSelfTest) -Wait -PassThru'
              continue
            }
            if ($t -eq 'if ($LASTEXITCODE -ne 0) { throw "Hidden-child runtime self-test failed with exit code $LASTEXITCODE" }') {
              'if ($p.ExitCode -ne 0) { throw "Hidden-child runtime self-test failed with exit code $($p.ExitCode)" }'
              continue
            }
            if ($t -eq '& $engine --batch (Join-Path $root "test-corpus\input") $corpusOutput') {
              '$p = Start-Process -FilePath $engine -ArgumentList @("--batch", (Join-Path $root "test-corpus\input"), $corpusOutput) -Wait -PassThru'
              continue
            }
            if ($t -eq 'if ($LASTEXITCODE -ne 0) { throw "Corpus run aborted with exit code $LASTEXITCODE" }') {
              'if ($p.ExitCode -ne 0) { throw "Corpus run aborted with exit code $($p.ExitCode)" }'
              continue
            }
            $line
          }
          Set-Content $buildPath -Value $patched -Encoding UTF8

          if ((Get-Content $frontPath -Raw) -notmatch 'ShellExecuteW') { throw "ShellExecute button fix missing." }
          if ((Get-Content $pipelinePath -Raw) -notmatch 'mark_info\["/Marked"\] = True') { throw "MarkInfo fix missing." }
          if ((Get-Content $runtimePath -Raw) -notmatch 'class HiddenPopen\(_ORIGINAL_POPEN\)') { throw "Popen class compatibility fix missing." }

      - name: Build, test, and exercise corpus
        shell: pwsh
        working-directory: work/pah040
        run: |
          .\scripts\build_windows.ps1

          $corpusResult = Get-Content ".\test-corpus\output\batch-result.json" -Raw | ConvertFrom-Json
          if ($corpusResult.processed -ne 11) { throw "Corpus did not process all 11 fixtures." }
          if ($corpusResult.failed -ne 2) { throw "Expected exactly 2 intentional corpus failures; got $($corpusResult.failed)." }

          $corpusCsv = Import-Csv ".\test-corpus\output\_accessibility_reports\Accessibility_Remediation_Summary.csv"
          foreach ($fixture in @("02_scanned_handout.pdf", "03_mixed_text_and_scan.pdf", "09_blank_page.pdf")) {
            $row = $corpusCsv | Where-Object { $_.source_file -eq $fixture } | Select-Object -First 1
            if (-not $row) { throw "Missing corpus row for $fixture." }
            if ($row.ocr_attempted -ne "yes") { throw "$fixture did not exercise OCR." }
            if ($row.status -eq "failed") { throw "$fixture failed OCR/remediation: $($row.error)" }
            if (-not $row.output_file) { throw "$fixture did not produce an output PDF." }
          }

          @'
from pathlib import Path
import csv
import pikepdf

out = Path("test-corpus/output")
rows = list(csv.DictReader((out / "_accessibility_reports/Accessibility_Remediation_Summary.csv").open(encoding="utf-8-sig")))
checked = 0
for row in rows:
    if row["status"] == "failed" or not row["output_file"]:
        continue
    pdf_path = out / row["output_file"]
    with pikepdf.Pdf.open(pdf_path) as pdf:
        root = pdf.Root
        if "/StructTreeRoot" not in root:
            raise SystemExit(f"{pdf_path.name}: missing StructTreeRoot")
        mark = root.get("/MarkInfo", None)
        if not mark or not bool(mark.get("/Marked", False)):
            raise SystemExit(f"{pdf_path.name}: missing /MarkInfo /Marked true")
    checked += 1
if checked < 9:
    raise SystemExit(f"Expected at least 9 completed corpus PDFs, checked {checked}")
print(f"Verified Acrobat tagged-PDF catalog metadata on {checked} corpus outputs.")
'@ | python -

          $version = (Get-Content ".\dist\PDFAccessibilityHelper\VERSION.txt" -Raw).Trim()
          if ($version -notmatch '^0\.4\.2\b') { throw "Packaged VERSION.txt is wrong: $version" }

          $report = Get-Content ".\test-corpus\output\_accessibility_reports\Accessibility_Remediation_Summary.html" -Raw
          if ($report -notmatch 'v0\.4\.2 uses an adaptive workflow') { throw "HTML report did not get v0.4.2 identity." }

      - name: Create portable ZIP
        shell: pwsh
        working-directory: work/pah040
        run: |
          $zip = ".\dist\PDF-Accessibility-Helper-v0.4.2-Windows-Portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path ".\dist\PDFAccessibilityHelper\*" -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw "Portable ZIP was not created." }

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Accessibility-Helper-v0.4.2-Windows-Portable
          path: work/pah040/dist/PDF-Accessibility-Helper-v0.4.2-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 30
