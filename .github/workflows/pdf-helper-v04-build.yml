name: Build PDF Accessibility Helper v0.4.1

on:
  push:
    branches:
      - build/pdf-accessibility-helper-v0.4.0
  workflow_dispatch:

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "pah-v040\v040_*.b64" | Sort-Object Name
          if ($parts.Count -ne 10) {
            throw "Expected 10 source chunks, found $($parts.Count)"
          }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ""
          [IO.File]::WriteAllBytes("source.zip", [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash "source.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "9d5af5319f95e191ca93741c0aedea0539d5c1f5c8cfa6d8fa169661e04e6c92") {
            throw "Source archive hash mismatch: $hash"
          }
          Expand-Archive "source.zip" -DestinationPath "work" -Force
          if (-not (Test-Path "work\pah040\scripts\build_windows.ps1")) {
            throw "Source archive did not unpack as expected."
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install Windows runtime dependencies
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          choco install temurin21jre --yes --no-progress
          $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("PATH", "User")
          tesseract --version
          java -version
          go version

      - name: Build, test, and exercise corpus
        shell: pwsh
        working-directory: work/pah040
        run: |
          # Follow the official veraPDF redirect with curl; PowerShell 7 rejects
          # the redirect because the intermediate URL uses HTTP.
          $installerPath = ".\scripts\install_verapdf.ps1"
          $installerScript = Get-Content $installerPath -Raw
          $installerScript = $installerScript.Replace(
            'Invoke-WebRequest -Uri "https://downloads.verapdf.org/rel/verapdf-installer.zip" -OutFile $zip',
            'curl.exe -L --fail --silent --show-error "https://downloads.verapdf.org/rel/verapdf-installer.zip" -o $zip; if ($LASTEXITCODE -ne 0) { throw "veraPDF download failed with exit code $LASTEXITCODE" }'
          )
          Set-Content $installerPath -Value $installerScript -Encoding UTF8

          # v0.4.0 installed the console-suppression hook before asyncio was
          # imported. That hook replaces subprocess.Popen, while asyncio's
          # Windows support subclasses subprocess.Popen during import. Import
          # asyncio first so the standard library captures the real Popen class.
          $launcherPath = ".\launcher.py"
          $launcher = Get-Content $launcherPath -Raw
          if ($launcher -notmatch '(?m)^import asyncio$') {
            $launcher = $launcher.Replace("import argparse", "import argparse" + [Environment]::NewLine + "import asyncio")
          }
          Set-Content $launcherPath -Value $launcher -Encoding UTF8
          if ((Get-Content $launcherPath -Raw) -notmatch '(?m)^import asyncio$') {
            throw "Failed to install the asyncio-before-subprocess compatibility fix."
          }

          # Bump package/build identity to v0.4.1.
          $initPath = ".\src\pdf_accessibility_helper\__init__.py"
          (Get-Content $initPath -Raw).Replace("0.4.0", "0.4.1") | Set-Content $initPath -Encoding UTF8
          (Get-Content ".\pyproject.toml" -Raw).Replace("0.4.0", "0.4.1") | Set-Content ".\pyproject.toml" -Encoding UTF8
          $buildVersionPath = ".\scripts\build_windows.ps1"
          (Get-Content $buildVersionPath -Raw).Replace("0.4.0 - adaptive performance build", "0.4.1 - adaptive performance build") | Set-Content $buildVersionPath -Encoding UTF8

          # The engine is a GUI-subsystem executable. Invoke it synchronously
          # during CI so diagnostics and corpus files exist before they are read.
          $buildPath = ".\scripts\build_windows.ps1"
          $lines = Get-Content $buildPath
          $patched = foreach ($line in $lines) {
            $t = $line.Trim()
            if ($t -eq '& $engine --diagnostics $diag') {
              'Write-Host "Running frozen-engine diagnostics..."'
              '$p = Start-Process -FilePath $engine -ArgumentList @("--diagnostics", $diag) -Wait -PassThru'
              continue
            }
            if ($t -eq 'if ($LASTEXITCODE -ne 0) { throw "Frozen-app diagnostics failed with exit code $LASTEXITCODE" }') {
              'if ($p.ExitCode -ne 0) { throw "Frozen-app diagnostics failed with exit code $($p.ExitCode)" }'
              continue
            }
            if ($t -eq '& $engine --runtime-self-test $runtimeSelfTest') {
              'Write-Host "Running hidden-child runtime self-test..."'
              '$p = Start-Process -FilePath $engine -ArgumentList @("--runtime-self-test", $runtimeSelfTest) -Wait -PassThru'
              continue
            }
            if ($t -eq 'if ($LASTEXITCODE -ne 0) { throw "Hidden-child runtime self-test failed with exit code $LASTEXITCODE" }') {
              'if ($p.ExitCode -ne 0) { throw "Hidden-child runtime self-test failed with exit code $($p.ExitCode)" }'
              continue
            }
            if ($t -eq '& $engine --batch (Join-Path $root "test-corpus\input") $corpusOutput') {
              'Write-Host "Running frozen engine over adversarial corpus..."'
              '$p = Start-Process -FilePath $engine -ArgumentList @("--batch", (Join-Path $root "test-corpus\input"), $corpusOutput) -Wait -PassThru'
              continue
            }
            if ($t -eq 'if ($LASTEXITCODE -ne 0) { throw "Corpus run aborted with exit code $LASTEXITCODE" }') {
              'if ($p.ExitCode -ne 0) { throw "Corpus run aborted with exit code $($p.ExitCode)" }'
              continue
            }
            $line
          }
          Set-Content $buildPath -Value $patched -Encoding UTF8

          $patchedText = Get-Content $buildPath -Raw
          if ($patchedText -match '(?m)^\s*& \$engine --(diagnostics|runtime-self-test|batch)') {
            throw "GUI-engine wait patch did not apply completely."
          }
          if (($patchedText | Select-String -Pattern 'Start-Process -FilePath \$engine' -AllMatches).Matches.Count -ne 3) {
            throw "Expected exactly three synchronous engine self-test invocations."
          }

          .\scripts\build_windows.ps1

          # Release gate: only the intentionally malformed and encrypted PDFs
          # may fail. Scanned/mixed/blank fixtures must exercise OCR and produce
          # finished PDFs in the actual frozen Windows executable.
          $corpusResult = Get-Content ".\test-corpus\output\batch-result.json" -Raw | ConvertFrom-Json
          if ($corpusResult.processed -ne 11) { throw "Corpus did not process all 11 fixtures." }
          if ($corpusResult.failed -ne 2) { throw "Expected exactly 2 intentional corpus failures; got $($corpusResult.failed)." }

          $corpusCsv = Import-Csv ".\test-corpus\output\_accessibility_reports\Accessibility_Remediation_Summary.csv"
          foreach ($fixture in @("02_scanned_handout.pdf", "03_mixed_text_and_scan.pdf", "09_blank_page.pdf")) {
            $row = $corpusCsv | Where-Object { $_.source_file -eq $fixture } | Select-Object -First 1
            if (-not $row) { throw "Missing corpus row for $fixture." }
            if ($row.ocr_attempted -ne "yes") { throw "$fixture did not exercise OCR." }
            if ($row.status -eq "failed") { throw "$fixture failed OCR/remediation: $($row.error)" }
            if (-not $row.output_file) { throw "$fixture did not produce an output PDF." }
          }

      - name: Create portable ZIP
        shell: pwsh
        working-directory: work/pah040
        run: |
          $zip = ".\dist\PDF-Accessibility-Helper-v0.4.1-Windows-Portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path ".\dist\PDFAccessibilityHelper\*" -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw "Portable ZIP was not created." }

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Accessibility-Helper-v0.4.1-Windows-Portable
          path: work/pah040/dist/PDF-Accessibility-Helper-v0.4.1-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 30
