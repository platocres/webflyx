name: Build PDF Accessibility Helper v0.3.4

on:
  workflow_dispatch:
  push:
    branches:
      - build/pdf-accessibility-helper-v0.3.1
    paths:
      - "pah-v034/**"
      - ".github/workflows/pdf-accessibility-helper-v034.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Reconstruct verified base source
        shell: powershell
        run: |
          $ordered = @(
            "pah-v032/chunk_00.b64",
            "pah-v032/chunk_01.b64",
            "pah-v032/chunk_02.b64",
            "pah-v032/chunk_03.b64",
            "pah-v032/chunk_04p0.b64",
            "pah-v032/chunk_04p1.b64",
            "pah-v032/chunk_04p2.b64",
            "pah-v032/chunk_04p3.b64",
            "pah-v032/chunk_05.b64",
            "pah-v032/chunk_06.b64"
          )
          $b64 = ($ordered | ForEach-Object { Get-Content $_ -Raw }) -join ""
          [IO.File]::WriteAllBytes("$PWD\pah-source.zip", [Convert]::FromBase64String($b64))
          $sha = (Get-FileHash "$PWD\pah-source.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "aa6f52d7d8202103020f5621240db43d67b516e945db81496b3610f960b958d5") {
            throw "Base source SHA256 mismatch: $sha"
          }
          Expand-Archive "$PWD\pah-source.zip" "$PWD\buildsrc" -Force

      - name: Apply verified v0.3.4 fixes
        shell: powershell
        run: |
          $patchParts = @(
            "pah-v034/patch_00.b64",
            "pah-v034/patch_01.b64",
            "pah-v034/patch_02.b64",
            "pah-v034/patch_03.b64",
            "pah-v034/patch_04.b64",
            "pah-v034/patch_05.b64",
            "pah-v034/patch_06.b64"
          )
          $patchB64 = ($patchParts | ForEach-Object { Get-Content $_ -Raw }) -join ""
          [IO.File]::WriteAllBytes("$PWD\v034.patch", [Convert]::FromBase64String($patchB64))
          $patchSha = (Get-FileHash "$PWD\v034.patch" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchSha -ne "2920c25c8a768e84154c3ecb58761d59605686fc031f5cd8128be70805005f3c") {
            throw "v0.3.4 patch SHA256 mismatch: $patchSha"
          }
          git apply --directory=buildsrc/pdf-accessibility-helper "$PWD\v034.patch"
          $version = Get-Content ".\buildsrc\pdf-accessibility-helper\src\pdf_accessibility_helper\__init__.py" -Raw
          if ($version -notmatch '0\.3\.4') {
            throw "v0.3.4 patch did not apply"
          }

      - name: Install Windows build dependencies
        shell: powershell
        run: |
          choco install tesseract -y --no-progress
          choco install temurin21jre -y --no-progress
          $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("PATH", "User")
          tesseract --version
          java -version

      - name: Build and validate portable application
        shell: powershell
        working-directory: buildsrc/pdf-accessibility-helper
        run: |
          .\scripts\build_windows.ps1

      - name: Verify final executable and runtime bundle
        shell: powershell
        working-directory: buildsrc/pdf-accessibility-helper
        run: |
          $app = ".\dist\PDFAccessibilityHelper"
          if (-not (Test-Path "$app\PDFAccessibilityHelper.exe")) { throw "EXE missing" }
          if (-not (Test-Path "$app\runtime\tesseract\tesseract.exe")) { throw "Bundled Tesseract missing" }
          if (-not (Test-Path "$app\runtime\jre\bin\java.exe")) { throw "Bundled Java missing" }
          if (-not (Test-Path "$app\runtime\verapdf")) { throw "Bundled veraPDF missing" }
          Get-Content "$app\build-diagnostics.json" -Raw
          Get-Content "$app\runtime-self-test.json" -Raw
          Get-Content ".\test-corpus\output\batch-result.json" -Raw

      - name: Create portable ZIP
        shell: powershell
        working-directory: buildsrc/pdf-accessibility-helper
        run: |
          Compress-Archive -Path .\dist\PDFAccessibilityHelper\* -DestinationPath .\dist\PDF-Accessibility-Helper-v0.3.4-Windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Accessibility-Helper-v0.3.4-Windows-x64
          path: buildsrc/pdf-accessibility-helper/dist/PDF-Accessibility-Helper-v0.3.4-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
