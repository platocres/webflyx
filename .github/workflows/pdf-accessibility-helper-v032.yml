name: Build PDF Accessibility Helper v0.3.2 Windows portable

on:
  workflow_dispatch:
  push:
    branches:
      - build/pdf-accessibility-helper-v0.3.1
    paths:
      - "pah-v032/**"
      - ".github/workflows/pdf-accessibility-helper-v032.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Reconstruct verified source archive
        shell: powershell
        run: |
          $ordered = @(
            "pah-v032/chunk_00.b64",
            "pah-v032/chunk_01.b64",
            "pah-v032/chunk_02.b64",
            "pah-v032/chunk_03.b64",
            "pah-v032/chunk_04p0.b64",
            "pah-v032/chunk_04p1.b64",
            "pah-v032/chunk_04p2.b64",
            "pah-v032/chunk_04p3.b64",
            "pah-v032/chunk_05.b64",
            "pah-v032/chunk_06.b64"
          )
          $b64 = ($ordered | ForEach-Object { Get-Content $_ -Raw }) -join ""
          [IO.File]::WriteAllBytes("$PWD\pah-source.zip", [Convert]::FromBase64String($b64))
          $sha = (Get-FileHash "$PWD\pah-source.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "aa6f52d7d8202103020f5621240db43d67b516e945db81496b3610f960b958d5") {
            throw "Source archive SHA256 mismatch: $sha"
          }
          New-Item -ItemType Directory -Force "$PWD\buildsrc" | Out-Null
          Expand-Archive "$PWD\pah-source.zip" "$PWD\buildsrc" -Force

      - name: Install external build dependencies
        shell: powershell
        working-directory: buildsrc/pdf-accessibility-helper
        run: |
          choco install tesseract -y --no-progress
          choco install temurin21jre -y --no-progress
          $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("PATH", "User")
          tesseract --version
          java -version

      - name: Build, test hidden subprocess handling, and run adversarial corpus
        shell: powershell
        working-directory: buildsrc/pdf-accessibility-helper
        run: |
          .\scripts\build_windows.ps1

      - name: Create portable release zip
        shell: powershell
        working-directory: buildsrc/pdf-accessibility-helper
        run: |
          Compress-Archive -Path .\dist\PDFAccessibilityHelper\* -DestinationPath .\dist\PDF-Accessibility-Helper-v0.3.2-Windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Accessibility-Helper-v0.3.2-Windows-x64
          path: buildsrc/pdf-accessibility-helper/dist/PDF-Accessibility-Helper-v0.3.2-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
