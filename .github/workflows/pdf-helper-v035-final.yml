name: Build PDF Accessibility Helper v0.3.5 Final

on:
  push:
    branches:
      - build/pdf-accessibility-helper-v0.3.5

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: pwsh
        run: |
          $parts = Get-ChildItem pah-src\v035_*.b64 | Sort-Object Name
          if ($parts.Count -ne 8) { throw "Expected 8 source chunks, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ""
          [IO.File]::WriteAllBytes("$PWD\pdf-helper-source.zip", [Convert]::FromBase64String($b64))
          Expand-Archive "$PWD\pdf-helper-source.zip" -DestinationPath "$PWD\source" -Force
          if (-not (Test-Path "$PWD\source\pdf-accessibility-helper\pyproject.toml")) { throw "Source reconstruction failed." }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Tesseract
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          if (Test-Path "C:\Program Files\Tesseract-OCR") {
            "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Run unit tests
        shell: pwsh
        working-directory: source/pdf-accessibility-helper
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m compileall -q src launcher.py
          python -m pytest -q

      - name: Build, hidden-process self-test, and adversarial corpus
        shell: pwsh
        working-directory: source/pdf-accessibility-helper
        run: |
          .\scripts\build_windows.ps1 -OutputRoot dist
          $exe = ".\dist\PDFAccessibilityHelper\PDFAccessibilityHelper.exe"
          if (-not (Test-Path $exe)) { throw "Portable executable was not produced." }

      - name: Package
        shell: pwsh
        working-directory: source/pdf-accessibility-helper
        run: |
          Compress-Archive -Path ".\dist\PDFAccessibilityHelper\*" -DestinationPath ".\PDF-Accessibility-Helper-v0.3.5-Windows-Portable.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Accessibility-Helper-v0.3.5-Windows-Portable
          path: source/pdf-accessibility-helper/PDF-Accessibility-Helper-v0.3.5-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 7
