name: Build PDF Accessibility Helper v0.3 Windows portable

on:
  push:
    branches:
      - build/pdf-accessibility-helper-v0.2
    paths:
      - "pah-v03/**"
      - ".github/workflows/pdf-accessibility-helper-v03.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Reconstruct v0.3 source
        shell: powershell
        run: |
          $chunks = Get-ChildItem ".\pah-v03\chunk_*.b64" | Sort-Object Name
          if ($chunks.Count -ne 7) { throw "Expected 7 source chunks, found $($chunks.Count)." }
          $b64 = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          $zip = Join-Path $env:RUNNER_TEMP "pah-v0.3.0-source.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $dest = Join-Path $env:RUNNER_TEMP "pah-src"
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          Copy-Item ".\pah-v03\build_windows.ps1" "$dest\pdf-accessibility-helper\scripts\build_windows.ps1" -Force
          "PAH_SOURCE=$dest\pdf-accessibility-helper" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install external build dependencies
        shell: powershell
        run: |
          choco install tesseract -y --no-progress
          choco install temurin21jre -y --no-progress
          $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("PATH", "User")
          tesseract --version
          java -version

      - name: Build portable app and run tests
        shell: powershell
        run: |
          Set-Location $env:PAH_SOURCE
          .\scripts\build_windows.ps1

      - name: Create release zip
        shell: powershell
        run: |
          Set-Location $env:PAH_SOURCE
          Compress-Archive -Path .\dist\PDFAccessibilityHelper\* -DestinationPath .\dist\PDF-Accessibility-Helper-v0.3.0-Windows-Portable.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Accessibility-Helper-v0.3.0-Windows-Portable
          path: ${{ env.PAH_SOURCE }}\dist\PDF-Accessibility-Helper-v0.3.0-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 30
