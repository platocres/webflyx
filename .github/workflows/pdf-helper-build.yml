name: Build PDF Accessibility Helper v0.3.4

on:
  push:
    branches:
      - build/pdf-accessibility-helper-v0.3.4
  workflow_dispatch:

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: pwsh
        run: |
          $parts = Get-ChildItem pah-src\v034_*.b64 | Sort-Object Name
          if (-not $parts) { throw "No source chunks found" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("pdf-helper-source.zip", [Convert]::FromBase64String($b64))
          Expand-Archive pdf-helper-source.zip -DestinationPath source -Force
          Get-ChildItem source\pdf-accessibility-helper
          $veraInstaller = "source\pdf-accessibility-helper\scripts\install_verapdf.ps1"
          $veraText = Get-Content $veraInstaller -Raw
          $veraText = $veraText.Replace('Invoke-WebRequest -Uri "https://downloads.verapdf.org/rel/verapdf-installer.zip" -OutFile $zip', '& curl.exe -L --fail --silent --show-error -o $zip "https://downloads.verapdf.org/rel/verapdf-installer.zip"')
          Set-Content -Path $veraInstaller -Value $veraText -Encoding UTF8

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/pdf-accessibility-helper/pyproject.toml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Tesseract
        shell: pwsh
        run: choco install tesseract --yes --no-progress

      - name: Build and self-test portable app
        shell: pwsh
        working-directory: source/pdf-accessibility-helper
        run: |
          .\scripts\build_windows.ps1 -OutputRoot dist
          if (-not (Test-Path .\dist\PDFAccessibilityHelper\PDFAccessibilityHelper.exe)) {
            throw "Portable executable was not produced."
          }

      - name: Package portable ZIP
        shell: pwsh
        working-directory: source/pdf-accessibility-helper
        run: |
          Compress-Archive -Path .\dist\PDFAccessibilityHelper\* -DestinationPath .\PDF-Accessibility-Helper-v0.3.4-Windows-Portable.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Accessibility-Helper-v0.3.4-Windows-Portable
          path: source/pdf-accessibility-helper/PDF-Accessibility-Helper-v0.3.4-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 7
