name: Build PDF Accessibility Helper v0.3.1

on:
  workflow_dispatch:
  push:
    branches:
      - build/pdf-accessibility-helper-v0.3.1
    paths:
      - "pdf-accessibility-helper-v0.3.1.zip.b64.part*"
      - ".github/workflows/pdf-accessibility-helper-v031.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: powershell
        run: |
          $parts = Get-ChildItem "pdf-accessibility-helper-v0.3.1.zip.b64.part*" | Sort-Object Name
          if ($parts.Count -ne 8) { throw "Expected 8 source chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("pdf-accessibility-helper-v0.3.1.zip", [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash "pdf-accessibility-helper-v0.3.1.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "7ec684c44729a85855c79cc827498c81d329e47e6e74e464a9a7f7218958d6ff") {
            throw "Source archive checksum mismatch: $hash"
          }
          Expand-Archive "pdf-accessibility-helper-v0.3.1.zip" -DestinationPath . -Force

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install external build dependencies
        shell: powershell
        working-directory: pdf-accessibility-helper
        run: |
          choco install tesseract -y --no-progress
          choco install temurin21jre -y --no-progress
          $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("PATH", "User")
          tesseract --version
          java -version

      - name: Build, verify hidden subprocesses, and run adversarial corpus
        shell: powershell
        working-directory: pdf-accessibility-helper
        run: |
          .\scripts\build_windows.ps1

      - name: Create portable ZIP
        shell: powershell
        working-directory: pdf-accessibility-helper
        run: |
          Compress-Archive -Path .\dist\PDFAccessibilityHelper\* -DestinationPath .\dist\PDF-Accessibility-Helper-Windows-Portable-v0.3.1.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Accessibility-Helper-Windows-Portable-v0.3.1
          path: pdf-accessibility-helper/dist/PDF-Accessibility-Helper-Windows-Portable-v0.3.1.zip
          if-no-files-found: error
          retention-days: 30
